<!DOCTYPE html>
<html lang="pt-BR">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RESOLVE | ZapGarantia</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{font-family:Inter,sans-serif}
input,select,textarea{color:#0f172a !important}
label{color:#1e293b !important; font-weight:700 !important; font-size:13px !important; display:block; margin-bottom:6px}
</style>
</head>
<body class="bg-slate-100">
<header class="bg-gradient-to-r from-blue-600 to-blue-700 text-white shadow-lg sticky top-0 z-40">
<div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
<a href="/" class="flex items-center gap-2">
<div class="w-9 h-9 bg-white rounded-xl flex items-center justify-center shadow"><i class="fa-solid fa-file-shield text-blue-600 text-lg"></i></div>
<div class="leading-none"><p class="font-black text-[17px]">ZapGarantia</p><p class="text-[11px] font-bold text-blue-100 tracking-widest">RESOLVE</p></div>
</a>
<a href="/" class="bg-white text-blue-600 font-bold px-4 py-2 rounded-full text-xs shadow">Voltar pro Orçamento</a>
</div>
</header>
<main class="max-w-3xl mx-auto p-4 space-y-4 pb-28">
<div id="authBox" class="bg-white p-6 rounded-2xl border shadow-sm">
<h1 class="font-black text-xl">Entrar no RESOLVE</h1>
<p class="text-[11px] text-slate-500 mt-1">Use o mesmo login do ZapGarantia</p>
<input id="email" type="email" placeholder="seu@email.com" class="w-full border-2 border-slate-200 focus:border-blue-600 rounded-xl px-4 py-3 mt-4 text-sm outline-none bg-slate-50">
<input id="password" type="password" placeholder="senha" class="w-full border-2 border-slate-200 focus:border-blue-600 rounded-xl px-4 py-3 mt-3 text-sm outline-none bg-slate-50">
<p id="authMsg" class="text-xs text-red-600 mt-3 font-bold hidden"></p>
<div class="flex gap-3 mt-4"><button id="btnLogin" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl text-sm shadow">Entrar</button><button id="btnSignup" class="flex-1 bg-slate-200 font-bold py-3 rounded-xl text-sm">Criar conta</button></div>
</div>
<div id="app" class="hidden space-y-4">
<div class="bg-white p-4 rounded-2xl border shadow-sm flex justify-between items-center">
<div><p id="userEmail" class="text-sm font-bold"></p></div>
<button id="btnLogout" class="bg-slate-100 px-4 py-2 rounded-full text-xs font-bold">Sair</button>
</div>
<div class="bg-white p-6 rounded-2xl border shadow-sm space-y-5">
<div class="flex items-center gap-2"><div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center"><i class="fa-solid fa-triangle-exclamation text-blue-600 text-sm"></i></div><h2 class="font-black text-[16px]">Nova reclamação</h2></div>
<div><label>Tipo de problema</label><select id="categoria" class="w-full border-2 border-slate-200 focus:border-blue-600 bg-white rounded-xl px-4 py-3.5 text-sm font-medium outline-none"></select></div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div><label>Seu nome completo</label><input id="f_nome" placeholder="Ex: João Silva" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm outline-none"></div>
<div><label>CPF</label><input id="f_cpf" placeholder="000.000.000-00" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm outline-none"></div>
<div class="sm:col-span-2"><label>Empresa / Cia aérea / Banco / Oficina</label><input id="f_empresa" placeholder="Ex: LATAM, Banco Itaú" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm outline-none"></div>
<div><label>Valor envolvido R$</label><input id="f_valor" placeholder="Ex: 350,00" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm outline-none"></div>
<div><label>Nº voo / protocolo / pedido / placa</label><input id="f_protocolo" placeholder="Ex: LA1234" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm outline-none"></div>
<div class="sm:col-span-2"><label>CEP (opcional)</label><input id="f_cep" placeholder="Ex: 01310-100" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm outline-none"></div>
<div class="sm:col-span-2"><label>Endereço / Cidade (opcional)</label><input id="f_endereco" placeholder="Ex: Rua das Flores, 123 - São Paulo - SP" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm outline-none"></div>
<div class="sm:col-span-2"><label>O que aconteceu? Descreva em 2 linhas</label><textarea id="f_relato" rows="4" placeholder="Ex: Voo atrasou 5 horas..." class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm outline-none resize-none"></textarea></div>
</div>
<button id="btnGerar" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white font-black py-4 rounded-xl text-sm shadow-lg">Gerar petição pronta</button>
</div>
<div id="resultado" class="hidden bg-white p-6 rounded-2xl border shadow-sm space-y-4">
<h3 class="font-black">Documento gerado</h3>
<pre id="peticaoTexto" class="text-[13px] whitespace-pre-wrap bg-slate-50 p-4 rounded-xl border max-h-96 overflow-auto"></pre>
<div class="grid grid-cols-3 gap-2">
<button id="btnCopiar" class="bg-slate-900 text-white font-bold py-3 rounded-xl text-xs">Copiar</button>
<button id="btnPdf" class="bg-slate-200 font-bold py-3 rounded-xl text-xs">PDF</button>
<button id="btnWa" class="bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs">Zap</button>
</div>
<p id="linkPublico" class="text-[11px] text-blue-600 break-all bg-blue-50 p-2 rounded-lg"></p>
</div>
<div class="bg-white p-5 rounded-2xl border shadow-sm">
<h3 class="font-black text-sm">Seus documentos</h3>
<div id="listaCasos" class="space-y-2 mt-4"></div>
</div>
</div>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SB_URL = "https://gktfwlhvdnsezqcpjrpf.supabase.co";
const SB_KEY = "sb_publishable_haJ8eg8OciGN6cK8GGg3ig_bGOKUAud";
const supabase = createClient(SB_URL, SB_KEY);
let currentUser=null, uploadedKey="", templates={};
async function loadTemplates(){
  const { data } = await supabase.from('resolve_templates').select('*').order('categoria');
  const sel=document.getElementById('categoria'); sel.innerHTML='';
  const fallback=[
    {categoria:'cliente_nao_pagou',titulo:'Cliente não pagou serviço - Notificação',corpo:'NOTIFICAÇÃO EXTRAJUDICIAL\n\nAo Sr(a) {{empresa}}\nEu {{nome}} CPF {{cpf}} voo {{protocolo}} valor {{valor}}. Relato: {{relato}}',campos:['nome','cpf','empresa','valor','protocolo','relato']},
    {categoria:'jardineiro',titulo:'Jardineiro - serviço não concluído',corpo:'Ao Sr(a) {{empresa}} - Serviço jardinagem R$ {{valor}} - {{relato}} - {nome}',campos:['nome','cpf','empresa','valor','protocolo','relato']},
    {categoria:'voo_atraso',titulo:'Voo atrasado +4h - ANAC 400 Art.21',corpo:'À {{empresa}}, Eu {{nome}} CPF {{cpf}} voo {{protocolo}} valor {{valor}}. Relato: {{relato}}',campos:['nome','cpf','empresa','valor','protocolo','relato']},
  ];
  const list=(data&&data.length)?data:fallback;
  list.forEach(t=>{ templates[t.categoria]=t; const o=document.createElement('option'); o.value=t.categoria; o.textContent=t.titulo; sel.appendChild(o); });
}
async function checkAuth(){
  const { data:{user}, error } = await supabase.auth.getUser();
  if(!user){ document.getElementById('authBox').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); return; }
  currentUser=user; document.getElementById('authBox').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); document.getElementById('userEmail').textContent=user.email; await loadTemplates(); await loadCasos();
}
document.getElementById('btnLogin').onclick=async()=>{
  const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
  const { error } = await supabase.auth.signInWithPassword({email,password});
  if(error){ document.getElementById('authMsg').textContent='Erro: '+error.message; document.getElementById('authMsg').classList.remove('hidden'); } else checkAuth();
};
document.getElementById('btnSignup').onclick=async()=>{
  const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
  const { error } = await supabase.auth.signUp({email,password});
  document.getElementById('authMsg').textContent=error?error.message:'Conta criada! Clique Entrar'; document.getElementById('authMsg').classList.remove('hidden');
};
document.getElementById('btnLogout').onclick=async()=>{ await supabase.auth.signOut(); location.reload(); };
document.getElementById('btnGerar').onclick=async()=>{
  const cat=document.getElementById('categoria').value; const t=templates[cat]; if(!t) return;
  const dados={}; ['nome','cpf','empresa','valor','protocolo'].forEach(c=>{ const el=document.getElementById('f_'+c); if(el) dados[c]=el.value; });
  dados.relato=document.getElementById('f_relato').value; dados.f_cep=document.getElementById('f_cep').value; dados.f_endereco=document.getElementById('f_endereco').value;
  let texto=t.corpo; for(const [k,v] of Object.entries(dados)){ texto=texto.replaceAll(`{{${k}}}`,v||''); }
  texto=texto.replaceAll('{{f_cep}}',dados.f_cep).replaceAll('{{f_endereco}}',dados.f_endereco);
  if(dados.f_cep) texto+=`\nCEP: ${dados.f_cep}`; if(dados.f_endereco) texto+=`\nEndereço: ${dados.f_endereco}`;
  const { data, error } = await supabase.from('casos').insert({professional_id:currentUser.id,categoria:cat,empresa:dados.empresa||'',valor:dados.valor||'',relato:dados.relato,peticao:texto,cliente_nome:dados.nome}).select('public_token').single();
  if(error){ alert(error.message); return; }
  document.getElementById('peticaoTexto').textContent=texto;
  document.getElementById('linkPublico').innerHTML=`🔗 <a href="/r/?token=${data.public_token}" target="_blank" class="underline font-bold">zapgarantia.alibr.com.br/r/?token=${data.public_token}</a>`;
  document.getElementById('resultado').classList.remove('hidden'); loadCasos();
};
document.getElementById('btnCopiar').onclick=()=>{ navigator.clipboard.writeText(document.getElementById('peticaoTexto').textContent); alert('Copiado!'); };
document.getElementById('btnPdf').onclick=()=>{ const { jsPDF }=window.jspdf; const doc=new jsPDF(); doc.text(doc.splitTextToSize(document.getElementById('peticaoTexto').textContent,180),10,15); doc.save('resolve.pdf'); };
document.getElementById('btnWa').onclick=()=> window.open('https://wa.me/?text='+encodeURIComponent(document.getElementById('peticaoTexto').textContent.slice(0,1200)),'_blank');
async function loadCasos(){
  const { data } = await supabase.from('casos').select('*').eq('professional_id',currentUser.id).order('created_at',{ascending:false}).limit(20);
  const lista=document.getElementById('listaCasos'); lista.innerHTML=''; if(!data||!data.length){ lista.innerHTML='<p class="text-xs text-slate-500 text-center py-4">Nenhum documento</p>'; return; }
  data.forEach(c=>{ const d=document.createElement('div'); d.className='border-2 border-slate-100 rounded-xl p-3 text-xs flex justify-between items-center'; d.innerHTML=`<div><p class="font-bold">${c.categoria} - ${c.empresa||''}</p><p class="text-[11px] text-slate-500">${c.status_assinatura||'Pendente'} • ${new Date(c.created_at).toLocaleDateString('pt-BR')}</p></div><a href="/r/?token=${c.public_token}" class="bg-blue-50 text-blue-600 font-bold px-3 py-1.5 rounded-full">Abrir</a>`; lista.appendChild(d); });
}
checkAuth();
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
