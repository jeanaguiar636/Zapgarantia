<!DOCTYPE html>
<html lang="pt-BR">
<head><style>

  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;

:where(code, pre, kbd, samp) {

</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documento RESOLVE | ZapGarantia</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>body{font-family:Inter,sans-serif} pre{white-space:pre-wrap}</style>
</head>
<body class="bg-slate-100">
<header class="bg-gradient-to-r from-blue-600 to-blue-700 text-white p-4 sticky top-0 shadow-lg">
<div class="max-w-2xl mx-auto flex justify-between items-center">
<a href="/" class="font-black flex items-center gap-2"><i class="fa-solid fa-scale-balanced"></i> RESOLVE</a>
<a href="/resolve/" class="bg-white text-blue-600 text-xs font-black px-4 py-2 rounded-full shadow">Criar outro</a>
</div>
</header>
<main class="max-w-2xl mx-auto p-4 space-y-4 pb-24">
<div id="loading" class="bg-white p-8 rounded-2xl border text-center shadow-sm"><p class="text-sm font-medium">Carregando documento...</p><p id="debug" class="text-[11px] text-slate-400 mt-2"></p></div>
<div id="doc" class="hidden space-y-4">
<div class="bg-white p-7 rounded-2xl border shadow-sm space-y-4">
<div class="flex gap-2 flex-wrap"><span id="catBadge" class="bg-blue-100 text-blue-800 text-[11px] font-black px-3 py-1 rounded-full uppercase"></span><span id="statusBadge" class="text-[11px] font-black px-3 py-1 rounded-full"></span></div>
<h1 id="empresa" class="font-black text-xl text-slate-900"></h1>
<p id="valor" class="text-sm font-bold"></p>
<div class="bg-slate-50 border-2 border-slate-200 rounded-xl p-4"><pre id="peticao" class="text-sm leading-relaxed font-medium"></pre></div>
<p id="data" class="text-[11px] text-slate-500"></p>
<div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 pt-3 border-t">
<button id="btnCopiarLink" class="bg-slate-900 text-white font-black py-3.5 rounded-xl text-xs flex flex-col items-center gap-1"><i class="fa-solid fa-link"></i> Copiar link</button>
<button id="btnCompartilhar" class="bg-emerald-600 text-white font-black py-3.5 rounded-xl text-xs flex flex-col items-center gap-1"><i class="fa-brands fa-whatsapp text-base"></i> Compartilhar</button>
<button id="btnVisitar" class="bg-blue-600 text-white font-black py-3.5 rounded-xl text-xs flex flex-col items-center gap-1"><i class="fa-solid fa-eye"></i> Visitar</button>
<button id="btnBaixar" class="bg-white border-2 border-slate-200 font-black py-3.5 rounded-xl text-xs flex flex-col items-center gap-1 text-slate-800"><i class="fa-solid fa-file-pdf text-red-500"></i> Baixar PDF</button>
</div>
</div>
<div id="assinaturaBox" class="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
<h2 class="font-black">O que você deseja fazer?</h2>
<input id="nomeAssina" placeholder="Seu nome completo *" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-blue-600 font-medium">
<textarea id="motivo" placeholder="Se Rejeitar ou Contestar, informe o motivo" rows="3" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-blue-600 resize-none"></textarea>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
<button id="btnAssinar" class="bg-emerald-600 text-white font-black py-3.5 rounded-xl text-sm shadow">Assinar e concordar</button>
<button id="btnRejeitar" class="bg-white border-2 border-red-200 text-red-600 font-black py-3.5 rounded-xl text-sm">Não concordo</button>
<button id="btnContestar" class="bg-amber-50 border-2 border-amber-300 text-amber-800 font-black py-3.5 rounded-xl text-sm">Contestar</button>
</div>
<p id="msg" class="text-xs text-center font-bold"></p>
</div>
<div id="assinadoBox" class="hidden p-7 rounded-2xl text-center border-2 shadow-sm">
<p id="assinadoTitulo" class="font-black text-lg"></p><p id="assinadoInfo" class="text-sm mt-2 font-medium"></p>
</div>
</div>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SB_URL = "https://gktfwlhvdnsezqcpjrpf.supabase.co";
const SB_KEY = "sb_publishable_haJ8eg8OciGN6cK8GGg3ig_bGOKUAud";
const supabase = createClient(SB_URL, SB_KEY);
function getToken(){ let t=new URLSearchParams(location.search).get('token'); if(!t){ const p=location.pathname.split('/').filter(Boolean); if(p.length>=2) t=p[1]; } return t; }
let currentToken=null, docData=null;
async function load(){
  const token=getToken(); currentToken=token; document.getElementById('debug').textContent='Token:'+(token||'NENHUM');
  if(!token){ document.getElementById('loading').innerHTML='Link inválido'; return; }
  let { data } = await supabase.from('casos').select('*').eq('public_token', token).single();
  if(!data){ let { data:rpc } = await supabase.rpc('get_public_caso',{p_token:token}); if(rpc&&rpc.length) data=rpc[0]; }
  if(!data){ document.getElementById('loading').innerHTML='Documento não encontrado'; return; }
  docData=data;
  document.getElementById('loading').classList.add('hidden'); document.getElementById('doc').classList.remove('hidden');
  document.getElementById('catBadge').textContent=data.categoria||'RESOLVE';
  document.getElementById('empresa').textContent=data.empresa||'';
  document.getElementById('valor').textContent=data.valor?`Valor: R$ ${data.valor}`:'';
  document.getElementById('peticao').textContent=data.peticao||'';
  document.getElementById('data').textContent='Criado em '+new Date(data.created_at).toLocaleString('pt-BR');
  const badge=document.getElementById('statusBadge');
  if(data.status_assinatura==='Assinado'){ badge.textContent=(data.cliente_nome||'Fulano')+' assinou e concordou'; badge.className='bg-emerald-500 text-white text-[11px] font-black px-3 py-1 rounded-full'; document.getElementById('assinaturaBox').classList.add('hidden'); const box=document.getElementById('assinadoBox'); box.classList.remove('hidden'); box.className='p-7 rounded-2xl text-center border-2 shadow-sm bg-emerald-50 border-emerald-300'; document.getElementById('assinadoTitulo').textContent='✅ '+(data.cliente_nome||'Fulano')+' assinou e concordou'; document.getElementById('assinadoTitulo').className='font-black text-lg text-emerald-800'; document.getElementById('assinadoInfo').textContent='Assinado em '+new Date(data.updated_at||data.created_at).toLocaleString('pt-BR'); }
  else if(data.status_assinatura==='Rejeitado' || data.status_assinatura==='Contestado'){ badge.textContent=(data.cliente_nome||'Fulano')+' NÃO concordou - '+data.status_assinatura; badge.className='bg-red-500 text-white text-[11px] font-black px-3 py-1 rounded-full'; document.getElementById('assinaturaBox').classList.add('hidden'); const box=document.getElementById('assinadoBox'); box.classList.remove('hidden'); box.className='p-7 rounded-2xl text-center border-2 shadow-sm bg-red-50 border-red-300'; document.getElementById('assinadoTitulo').textContent='❌ '+(data.cliente_nome||'Fulano')+' não concordou'; document.getElementById('assinadoTitulo').className='font-black text-lg text-red-800'; document.getElementById('assinadoInfo').textContent=data.motivo_rejeicao||data.status_assinatura; }
  else { badge.textContent='Aguardando assinatura'; badge.className='bg-amber-400 text-amber-900 text-[11px] font-black px-3 py-1 rounded-full'; }

  document.getElementById('btnCopiarLink').onclick=()=>{ navigator.clipboard.writeText(location.href); alert('Link copiado!'); };
  document.getElementById('btnCompartilhar').onclick=()=>{ window.open('https://wa.me/?text='+encodeURIComponent('Seu documento RESOLVE: '+location.href),'_blank'); };
  document.getElementById('btnVisitar').onclick=()=>{ window.open(location.href,'_blank'); };
  document.getElementById('btnBaixar').onclick=()=>{ const { jsPDF }=window.jspdf; const doc=new jsPDF(); doc.text(doc.splitTextToSize(docData.peticao||'',180),10,15); doc.save('RESOLVE-'+(docData.empresa||'doc')+'.pdf'); };
}
async function assinar(st){ const nome=document.getElementById('nomeAssina').value.trim(); const motivo=document.getElementById('motivo').value.trim(); if(st==='Assinado' && !nome){ alert('Digite nome'); return; } if(st!=='Assinado' && !motivo){ alert('Informe motivo'); return; } document.getElementById('msg').textContent='Enviando...'; await supabase.from('casos').update({status_assinatura:st, motivo_rejeicao:motivo, cliente_nome:nome}).eq('public_token',currentToken); document.getElementById('msg').textContent='✅ '+st; setTimeout(()=>location.reload(),1000); }
document.getElementById('btnAssinar').onclick=()=>assinar('Assinado');
document.getElementById('btnRejeitar').onclick=()=>assinar('Rejeitado');
document.getElementById('btnContestar').onclick=()=>assinar('Contestado');
load();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
