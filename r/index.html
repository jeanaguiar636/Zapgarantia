<!DOCTYPE html>
<html lang="pt-BR">
<head><style>

  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;

</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documento RESOLVE | ZapGarantia</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:Inter,sans-serif} pre{white-space:pre-wrap}</style>
</head>
<body class="bg-slate-100">
<header class="bg-blue-600 text-white p-4 sticky top-0">
<div class="max-w-2xl mx-auto flex justify-between items-center">
<a href="/" class="font-black flex items-center gap-2"><i class="fa-solid fa-file-shield"></i> ZapGarantia RESOLVE</a>
<a href="/resolve/" class="bg-white text-blue-600 text-xs font-bold px-3 py-1.5 rounded-full">Criar outro</a>
</div>
</header>
<main class="max-w-2xl mx-auto p-4 space-y-4">
<div id="loading" class="bg-white p-8 rounded-2xl border text-center">
<p class="text-sm text-slate-600"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Carregando documento...</p>
<p id="debug" class="text-[11px] text-slate-400 mt-2 break-all"></p>
</div>
<div id="doc" class="hidden space-y-4">
<div class="bg-white p-6 rounded-2xl border shadow-sm">
<div class="flex items-center gap-2 mb-3"><span id="catBadge" class="bg-blue-100 text-blue-700 text-[11px] font-black px-2.5 py-1 rounded-full uppercase">CATEGORIA</span><span id="statusBadge" class="text-[11px] font-bold px-2.5 py-1 rounded-full">Pendente</span></div>
<h1 id="empresa" class="font-black text-lg">Empresa</h1>
<p id="valor" class="text-sm text-slate-600 mt-1"></p>
<div class="mt-4 bg-slate-50 border rounded-xl p-4">
<pre id="peticao" class="text-sm text-slate-800 leading-relaxed"></pre>
</div>
<div id="fotoBox" class="hidden mt-4">
<p class="text-xs font-bold mb-2">Comprovante:</p>
<img id="foto" class="w-full rounded-xl border max-h-96 object-contain bg-white">
</div>
<p id="data" class="text-[11px] text-slate-500 mt-3"></p>
</div>
<div id="assinaturaBox" class="bg-white p-6 rounded-2xl border shadow-sm space-y-3">
<h2 class="font-black text-sm">O que você deseja fazer?</h2>
<input id="nomeAssina" placeholder="Seu nome completo para assinar" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-600">
<textarea id="motivo" placeholder="Se Rejeitar ou Contestar, informe o motivo (obrigatório)" rows="3" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-600 resize-none"></textarea>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
<button id="btnAssinar" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-sm">Assinar</button>
<button id="btnRejeitar" class="bg-red-50 border-2 border-red-200 text-red-700 font-bold py-3 rounded-xl text-sm">Rejeitar</button>
<button id="btnContestar" class="bg-amber-50 border-2 border-amber-200 text-amber-800 font-bold py-3 rounded-xl text-sm">Contestar</button>
</div>
<p id="msg" class="text-xs text-center"></p>
</div>
<div id="assinadoBox" class="hidden bg-emerald-50 border-2 border-emerald-200 p-6 rounded-2xl text-center">
<p class="font-black text-emerald-800">Documento já assinado</p>
<p id="assinadoInfo" class="text-xs text-emerald-700 mt-2"></p>
</div>
</div>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SB_URL = "https://gktfwlhvdnsezqcpjrpf.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdGZ3bGh2ZG5zZXpxY3BqcnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMwMTA2MTIsImV4cCI6MjA3ODU4NjYxMn0.D2V2wuRVYi67AsOU6vLLt2lH5sV1oxWIwyU4iQJy9bo";
const R2_PUBLIC = "https://pub.seu-dominio.r2.dev";
const supabase = createClient(SB_URL, SB_KEY);

function getToken(){
  let t = new URLSearchParams(location.search).get('token') || new URLSearchParams(location.search).get('t');
  if(!t){
    const parts = location.pathname.split('/').filter(Boolean);
    if(parts.length>=2 && parts[0]==='r') t = parts[1];
    if(parts.length===1 && parts[0]!=='r' && parts[0]!=='c' && parts[0]!=='resolve') t = parts[0];
  }
  if(!t && location.hash) t = location.hash.replace('#','');
  return t;
}

async function load(){
  const token = getToken();
  document.getElementById('debug').textContent = 'Token: '+(token||'NENHUM')+' | URL: '+location.href;
  if(!token){ document.getElementById('loading').innerHTML='<p class="text-sm text-red-600">Link inválido - token não encontrado na URL</p>'; return; }
  
  let data = null;
  let { data: d1, error: e1 } = await supabase.from('casos').select('*').eq('public_token', token).single();
  if(d1) data = d1;
  else {
    console.log('select direto falhou', e1);
    let { data: rpcData } = await supabase.rpc('get_public_caso', { p_token: token });
    if(rpcData && rpcData.length) data = rpcData[0];
    else if(rpcData && rpcData.public_token) data = rpcData;
  }

  if(!data){
    document.getElementById('loading').innerHTML=`<div class="text-center"><p class="text-sm text-red-600 font-bold">Documento não encontrado</p><p class="text-xs text-slate-500 mt-2">Token: ${token}</p><p class="text-[11px] text-slate-400 mt-2">Se esse token existe no SQL, é bloqueio RLS. Rode o fix-final-banco.sql no Supabase e dê F5 aqui.</p></div>`;
    return;
  }

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('doc').classList.remove('hidden');
  document.getElementById('catBadge').textContent = data.categoria || 'RESOLVE';
  document.getElementById('empresa').textContent = data.empresa || data.cliente_nome || 'Documento RESOLVE';
  document.getElementById('valor').textContent = data.valor ? `Valor: R$ ${data.valor}` : '';
  document.getElementById('peticao').textContent = data.peticao || data.relato || '';
  document.getElementById('data').textContent = `Criado em ${new Date(data.created_at).toLocaleString('pt-BR')}`;
  const statusBadge = document.getElementById('statusBadge');
  statusBadge.textContent = data.status_assinatura || 'Pendente';
  statusBadge.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full ' + (data.status_assinatura==='Assinado' ? 'bg-emerald-100 text-emerald-700' : data.status_assinatura==='Rejeitado' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700');
  if(data.image_key && R2_PUBLIC && !R2_PUBLIC.includes('SEU')){
    document.getElementById('fotoBox').classList.remove('hidden');
    document.getElementById('foto').src = `${R2_PUBLIC}/${data.image_key}`;
  }
  if(data.status_assinatura && data.status_assinatura !== 'Pendente'){
    document.getElementById('assinaturaBox').classList.add('hidden');
    document.getElementById('assinadoBox').classList.remove('hidden');
    document.getElementById('assinadoInfo').textContent = `${data.status_assinatura} ${data.motivo_rejeicao ? '- '+data.motivo_rejeicao : ''}`;
  }

  async function atualizar(novoStatus){
    const nome = document.getElementById('nomeAssina').value.trim();
    const motivo = document.getElementById('motivo').value.trim();
    if(novoStatus==='Assinado' && !nome){ alert('Digite seu nome completo'); return; }
    if(novoStatus!=='Assinado' && !motivo){ alert('Informe o motivo'); return; }
    document.getElementById('msg').textContent = 'Enviando...';
    let { error } = await supabase.from('casos').update({ status_assinatura: novoStatus, motivo_rejeicao: motivo || null, cliente_nome: nome || data.cliente_nome, status: novoStatus==='Assinado' ? 'Resolvido' : 'Pendente' }).eq('public_token', token);
    if(error){
      let { error: rpcErr } = await supabase.rpc('sign_caso', { p_token: token, p_nome: nome, p_status: novoStatus, p_motivo: motivo });
      if(rpcErr){ document.getElementById('msg').textContent = 'Erro: '+(error.message || rpcErr.message); return; }
    }
    document.getElementById('msg').textContent = '✅ '+novoStatus+' com sucesso!';
    setTimeout(()=> location.reload(), 1500);
  }
  document.getElementById('btnAssinar').onclick = ()=> atualizar('Assinado');
  document.getElementById('btnRejeitar').onclick = ()=> atualizar('Rejeitado');
  document.getElementById('btnContestar').onclick = ()=> atualizar('Contestado');
}
load();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
