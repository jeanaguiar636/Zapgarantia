<html lang="pt-BR">
<head><style>

  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}

  font-family: "Optimistic Mono";
  font-style: normal;

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documento RESOLVE | ZapGarantia</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:Inter,sans-serif} pre{white-space:pre-wrap}</style>
</head>
<body class="bg-slate-100">
<header class="bg-blue-600 text-white p-4 sticky top-0">
<div class="max-w-2xl mx-auto flex justify-between items-center">
<a href="/" class="font-black flex items-center gap-2"><i class="fa-solid fa-file-shield"></i> ZapGarantia RESOLVE</a>
<a href="/resolve/" class="bg-white text-blue-600 text-xs font-bold px-3 py-1.5 rounded-full">Criar outro</a>
</div>
</header>
<main class="max-w-2xl mx-auto p-4 space-y-4">
<div id="loading" class="bg-white p-8 rounded-2xl border text-center">
<p class="text-sm text-slate-600"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Carregando documento...</p>
<p id="debug" class="text-[11px] text-slate-400 mt-2 break-all"></p>
</div>
<div id="doc" class="hidden space-y-4">
<div class="bg-white p-6 rounded-2xl border shadow-sm">
<div class="flex items-center gap-2 mb-3"><span id="catBadge" class="bg-blue-100 text-blue-700 text-[11px] font-black px-2.5 py-1 rounded-full uppercase">CATEGORIA</span><span id="statusBadge" class="text-[11px] font-bold px-2.5 py-1 rounded-full">Pendente</span></div>
<h1 id="empresa" class="font-black text-lg">Empresa</h1>
<p id="valor" class="text-sm text-slate-600 mt-1"></p>
<div class="mt-4 bg-slate-50 border rounded-xl p-4">
<pre id="peticao" class="text-sm text-slate-800 leading-relaxed"></pre>
</div>
<p id="data" class="text-[11px] text-slate-500 mt-3"></p>
</div>
<div id="assinaturaBox" class="bg-white p-6 rounded-2xl border shadow-sm space-y-3">
<h2 class="font-black text-sm">O que você deseja fazer?</h2>
<input id="nomeAssina" placeholder="Seu nome completo para assinar" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-600">
<textarea id="motivo" placeholder="Se Rejeitar ou Contestar, informe o motivo (obrigatório)" rows="3" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:border-blue-600 resize-none"></textarea>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
<button id="btnAssinar" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl text-sm">Assinar</button>
<button id="btnRejeitar" class="bg-red-50 border-2 border-red-200 text-red-700 font-bold py-3 rounded-xl text-sm">Rejeitar</button>
<button id="btnContestar" class="bg-amber-50 border-2 border-amber-200 text-amber-800 font-bold py-3 rounded-xl text-sm">Contestar</button>
</div>
<p id="msg" class="text-xs text-center"></p>
</div>
<div id="assinadoBox" class="hidden bg-emerald-50 border-2 border-emerald-200 p-6 rounded-2xl text-center">
<p class="font-black text-emerald-800">Documento já assinado</p>
<p id="assinadoInfo" class="text-xs text-emerald-700 mt-2"></p>
</div>
</div>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SB_URL = "https://gktfwlhvdnsezqcpjrpf.supabase.co";
const SB_KEY = "sb_publishable_haJ8eg8OciGN6cK8GGg3ig_bGOKUAud";
const supabase = createClient(SB_URL, SB_KEY);
function getToken(){
  let t = new URLSearchParams(location.search).get('token') || new URLSearchParams(location.search).get('t');
  if(!t){ const parts = location.pathname.split('/').filter(Boolean); if(parts.length>=2 && parts[0]==='r') t = parts[1]; }
  if(!t && location.hash) t = location.hash.replace('#','');
  return t;
}
async function load(){
  const token = getToken();
  document.getElementById('debug').textContent = 'Token: '+(token||'NENHUM');
  if(!token){ document.getElementById('loading').innerHTML='<p class="text-sm text-red-600">Link inválido</p>'; return; }
  let { data } = await supabase.from('casos').select('*').eq('public_token', token).single();
  if(!data){ let { data: rpc } = await supabase.rpc('get_public_caso', { p_token: token }); if(rpc && rpc.length) data = rpc[0]; }
  if(!data){ document.getElementById('loading').innerHTML=`<div class="text-center"><p class="text-sm text-red-600 font-bold">Documento não encontrado</p><p class="text-xs text-slate-500 mt-2">Token: ${token}</p></div>`; return; }
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('doc').classList.remove('hidden');
  document.getElementById('catBadge').textContent = data.categoria || 'RESOLVE';
  document.getElementById('empresa').textContent = data.empresa || data.cliente_nome || 'Documento';
  document.getElementById('valor').textContent = data.valor ? `Valor: R$ ${data.valor}` : '';
  document.getElementById('peticao').textContent = data.peticao || data.relato || '';
  document.getElementById('data').textContent = `Criado em ${new Date(data.created_at).toLocaleString('pt-BR')}`;
  const statusBadge = document.getElementById('statusBadge');
  statusBadge.textContent = data.status_assinatura || 'Pendente';
  if(data.status_assinatura && data.status_assinatura !== 'Pendente'){
    document.getElementById('assinaturaBox').classList.add('hidden');
    document.getElementById('assinadoBox').classList.remove('hidden');
    document.getElementById('assinadoInfo').textContent = `${data.status_assinatura} ${data.motivo_rejeicao ? '- '+data.motivo_rejeicao : ''}`;
  }
  async function atualizar(novoStatus){
    const nome = document.getElementById('nomeAssina').value.trim();
    const motivo = document.getElementById('motivo').value.trim();
    if(novoStatus==='Assinado' && !nome){ alert('Digite seu nome'); return; }
    if(novoStatus!=='Assinado' && !motivo){ alert('Informe motivo'); return; }
    document.getElementById('msg').textContent='Enviando...';
    let { error } = await supabase.from('casos').update({ status_assinatura: novoStatus, motivo_rejeicao: motivo || null, cliente_nome: nome || data.cliente_nome }).eq('public_token', token);
    if(error){ let { error: rpcErr } = await supabase.rpc('sign_caso', { p_token: token, p_nome: nome, p_status: novoStatus, p_motivo: motivo }); if(rpcErr){ document.getElementById('msg').textContent='Erro: '+(error.message||rpcErr.message); return; } }
    document.getElementById('msg').textContent='✅ '+novoStatus; setTimeout(()=>location.reload(),1200);
  }
  document.getElementById('btnAssinar').onclick=()=>atualizar('Assinado');
  document.getElementById('btnRejeitar').onclick=()=>atualizar('Rejeitado');
  document.getElementById('btnContestar').onclick=()=>atualizar('Contestado');
}
load();
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
