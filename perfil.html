<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Perfil do profissional | ZapGarantia</title>
    <meta name="description" content="Conheça este profissional e peça seu orçamento. Orçamento com assinatura do cliente e PDF pelo ZapGarantia.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ZapGarantia">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="Perfil do profissional | ZapGarantia">
    <meta property="og:description" content="Conheça este profissional e fale com ele pelo WhatsApp. Orçamento com assinatura do cliente e PDF pelo ZapGarantia.">
    <meta property="og:image" content="https://zapgarantia.alibr.com.br/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased">
    <header class="bg-blue-600 text-white shadow-md">
        <a href="/" class="max-w-xl mx-auto px-4 py-3 flex items-center space-x-2 font-bold text-lg">
            <img src="icon-192.png" alt="" class="w-8 h-8 rounded-lg"><span>ZapGarantia</span>
        </a>
    </header>
    <main class="max-w-xl mx-auto pb-10 space-y-4">
        <p id="state" class="p-10 text-center text-slate-700">Carregando perfil...</p>
        <article id="card" class="hidden bg-white sm:rounded-2xl overflow-hidden shadow-sm sm:mt-4">
            <div class="relative h-36 sm:h-48 bg-gradient-to-r from-blue-700 to-blue-500">
                <img id="cover" alt="" class="hidden absolute inset-0 w-full h-full object-cover">
            </div>
            <div class="px-4 pb-5">
                <div class="-mt-14 flex items-end justify-between">
                    <img id="avatar" alt="" class="w-28 h-28 rounded-full border-4 border-white bg-slate-200 object-cover" src="icon-192.png">
                    <button id="btnShare" class="mb-1 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-800 px-3.5 py-2 rounded-full cursor-pointer">Compartilhar</button>
                </div>
                <h1 id="name" class="text-2xl font-black mt-2"></h1>
                <p id="city" class="hidden text-sm text-slate-700"></p>
                <p id="signed" class="hidden inline-block mt-2 text-xs font-bold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full"></p>
                <p id="bio" class="mt-3 text-sm text-slate-800 whitespace-pre-line"></p>
                <a id="btnWa" target="_blank" rel="noopener noreferrer" class="hidden mt-4 block text-center bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm">Falar no WhatsApp</a>
            </div>
        </article>
        <a id="cta" href="/" class="hidden mx-4 sm:mx-0 block bg-white border border-blue-100 rounded-2xl shadow-sm p-4 text-center">
            <span class="block text-sm font-bold text-slate-900">Você também é profissional?</span>
            <span class="block text-xs text-slate-700 mt-0.5">Faça orçamento com fotos, assinatura do cliente e PDF.</span>
            <span class="inline-block mt-2 bg-blue-600 text-white text-xs font-bold px-4 py-2 rounded-lg">Crie sua conta grátis</span>
        </a>
    </main>
    <script>
        const SB_URL = "https://gktfwlhvdnsezqcpjrpf.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdGZ3bGh2ZG5zZXpxY3BqcnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MTk2MDgsImV4cCI6MjEwNzM5NTYwOH0.D2V2wuRVYi67AsOU6vLLt2lH5sV1oxWIwyU4iQJy9bo";
        // sem biblioteca: uma chamada direta ao banco (a página abre mais rápido)
        async function getProfile(key) {
            const r = await fetch(SB_URL + '/rest/v1/rpc/get_public_profile', {
                method: 'POST',
                headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ p_key: key })
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return await r.json();
        }
        const $ = id => document.getElementById(id);
        const okUrl = u => typeof u === 'string' && /^https:\/\//i.test(u);

        function waLink(num, name) {
            let d = String(num || '').replace(/\D/g, '');
            if (!d) return null;
            if (d.length <= 11) d = '55' + d;
            return 'https://wa.me/' + d + '?text=' + encodeURIComponent('Olá' + (name ? ', ' + name.split(' ')[0] : '') + '! Vi seu perfil no ZapGarantia e gostaria de um orçamento.');
        }

        (async () => {
            const key = (new URLSearchParams(location.search).get('u') || '').trim();
            if (!key) { $('state').textContent = 'Perfil não encontrado.'; return; }
            let data = null;
            try { data = await getProfile(key); } catch (e) { $('state').textContent = 'Não consegui carregar agora. Confira a internet e tente de novo.'; return; }
            if (!data) { $('state').textContent = 'Perfil não encontrado ou indisponível.'; return; }
            document.title = data.name + ' | ZapGarantia';
            $('name').textContent = data.name;
            if (data.city) { $('city').textContent = data.city; $('city').classList.remove('hidden'); }
            if (data.bio) $('bio').textContent = data.bio;
            const n = Number(data.signed) || 0;
            if (n > 0) { $('signed').textContent = n + (n === 1 ? ' orçamento assinado' : ' orçamentos assinados'); $('signed').classList.remove('hidden'); }
            if (okUrl(data.cover_url)) { $('cover').src = data.cover_url; $('cover').classList.remove('hidden'); }
            if (okUrl(data.avatar_url)) $('avatar').src = data.avatar_url;
            const wa = waLink(data.whatsapp, data.name);
            if (wa) { $('btnWa').href = wa; $('btnWa').classList.remove('hidden'); }
            if (data.ref_code) $('cta').href = '/?ref=' + encodeURIComponent(data.ref_code);
            $('cta').classList.remove('hidden');
            $('btnShare').onclick = async () => {
                const url = location.href;
                try { if (navigator.share) { await navigator.share({ title: data.name + ' no ZapGarantia', text: 'Veja o perfil de ' + data.name, url }); return; } } catch (e) { return; }
                try { await navigator.clipboard.writeText(url); alert('Link copiado!'); } catch (e) { prompt('Copie o link:', url); }
            };
            $('state').classList.add('hidden');
            $('card').classList.remove('hidden');
        })();
    </script>
</body>
</html>
