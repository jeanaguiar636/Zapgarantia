<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Perfil do profissional | ZapGarantia</title>
    <meta name="description" content="Conheça este profissional e peça seu orçamento. Orçamento com assinatura do cliente e PDF pelo ZapGarantia.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ZapGarantia">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="Perfil do profissional | ZapGarantia">
    <meta property="og:description" content="Conheça este profissional e fale com ele pelo WhatsApp. Orçamento com assinatura do cliente e PDF pelo ZapGarantia.">
    <meta property="og:image" content="https://zapgarantia.alibr.com.br/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased">
    <header class="bg-blue-600 text-white shadow-md">
        <a href="/" class="max-w-xl mx-auto px-4 py-3 flex items-center space-x-2 font-bold text-lg">
            <img src="icon-192.png" alt="" class="w-8 h-8 rounded-lg"><span>ZapGarantia</span>
        </a>
    </header>
    <main class="max-w-xl mx-auto pb-28 space-y-4">
        <p id="state" class="p-10 text-center text-slate-700">Carregando perfil...</p>
        <article id="card" class="hidden bg-white sm:rounded-2xl overflow-hidden shadow-sm sm:mt-4">
            <div class="relative h-36 sm:h-48 bg-gradient-to-r from-blue-700 to-blue-500">
                <img id="cover" alt="" class="hidden absolute inset-0 w-full h-full object-cover">
            </div>
            <div class="px-4 pb-5">
                <div class="-mt-14 flex items-end justify-between">
                    <img id="avatar" alt="" class="w-28 h-28 rounded-full border-4 border-white bg-slate-200 object-cover" src="icon-192.png">
                    <button id="btnShare" class="mb-1 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-800 px-3.5 py-2 rounded-full cursor-pointer">Compartilhar</button>
                </div>
                <h1 id="name" class="text-2xl font-black mt-2"></h1>
                <p id="city" class="hidden text-sm text-slate-700"></p>
                <p id="signed" class="hidden inline-block mt-2 text-xs font-bold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full"></p>
                <p id="bio" class="mt-3 text-sm text-slate-800 whitespace-pre-line"></p>
                <a id="btnWa" target="_blank" rel="noopener noreferrer" class="hidden mt-4 block text-center bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm">Falar no WhatsApp</a>
            </div>
        </article>
        <section id="posts" class="hidden px-4 sm:px-0 space-y-3">
            <h2 class="text-base font-black text-slate-900">Serviços realizados</h2>
            <div id="postList" class="space-y-3"></div>
            <button id="btnMore" class="hidden w-full bg-white border border-slate-200 text-slate-800 text-sm font-bold py-3 rounded-xl cursor-pointer">Ver mais serviços</button>
        </section>
        <a id="cta" href="/" class="hidden mx-4 sm:mx-0 block bg-white border border-blue-100 rounded-2xl shadow-sm p-4 text-center">
            <span class="block text-sm font-bold text-slate-900">Você também é profissional?</span>
            <span class="block text-xs text-slate-700 mt-0.5">Faça orçamento com fotos, assinatura do cliente e PDF.</span>
            <span class="inline-block mt-2 bg-blue-600 text-white text-xs font-bold px-4 py-2 rounded-lg">Crie sua conta grátis</span>
        </a>
    </main>
    <div id="waBar" class="hidden fixed bottom-0 inset-x-0 bg-white/95 border-t border-slate-200 p-3">
        <a id="btnWa2" target="_blank" rel="noopener noreferrer" class="block max-w-xl mx-auto text-center bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-sm">Falar no WhatsApp</a>
    </div>
    <div id="viewer" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-3">
        <button id="vClose" class="absolute top-4 right-5 text-white text-4xl leading-none" aria-label="Fechar">&times;</button>
        <button id="vPrev" class="absolute left-1 top-1/2 text-white text-5xl px-3" aria-label="Anterior">&#8249;</button>
        <button id="vNext" class="absolute right-1 top-1/2 text-white text-5xl px-3" aria-label="Próxima">&#8250;</button>
        <img id="vImg" alt="" class="max-w-full max-h-full object-contain">
    </div>
    <script>
        const SB_URL = "https://gktfwlhvdnsezqcpjrpf.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrdGZ3bGh2ZG5zZXpxY3BqcnBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MTk2MDgsImV4cCI6MjEwNzM5NTYwOH0.D2V2wuRVYi67AsOU6vLLt2lH5sV1oxWIwyU4iQJy9bo";
        // sem biblioteca: uma chamada direta ao banco (a página abre mais rápido)
        async function getProfile(key) {
            const r = await fetch(SB_URL + '/rest/v1/rpc/get_public_profile', {
                method: 'POST',
                headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ p_key: key })
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return await r.json();
        }
        const $ = id => document.getElementById(id);
        const okUrl = u => typeof u === 'string' && /^https:\/\//i.test(u);

        async function rpc(name, args) {
            const r = await fetch(SB_URL + '/rest/v1/rpc/' + name, {
                method: 'POST',
                headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify(args)
            });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return await r.json();
        }

        // visualizador de fotos
        let vList = [], vIdx = 0;
        function vShow() { $('vImg').src = vList[vIdx]; $('vPrev').classList.toggle('hidden', vList.length < 2); $('vNext').classList.toggle('hidden', vList.length < 2); }
        function vOpen(list, i) { vList = list; vIdx = i; vShow(); $('viewer').classList.remove('hidden'); }
        function vStep(d) { vIdx = (vIdx + d + vList.length) % vList.length; vShow(); }
        $('vClose').onclick = () => $('viewer').classList.add('hidden');
        $('viewer').onclick = e => { if (e.target === $('viewer')) $('viewer').classList.add('hidden'); };
        $('vPrev').onclick = e => { e.stopPropagation(); vStep(-1); };
        $('vNext').onclick = e => { e.stopPropagation(); vStep(1); };

        function postCard(po, key, ownerName) {
            const art = document.createElement('article');
            art.id = 'p-' + po.id;
            art.className = 'bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm';
            const body = document.createElement('div'); body.className = 'p-4 space-y-2';
            const top = document.createElement('div'); top.className = 'flex items-center justify-between gap-2';
            const dt = document.createElement('span'); dt.className = 'text-xs text-slate-700';
            dt.textContent = new Date(po.created_at).toLocaleDateString('pt-BR');
            top.appendChild(dt);
            if (po.signed) {
                const b = document.createElement('span'); b.className = 'text-xs font-bold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full';
                b.textContent = 'Assinado pelo cliente'; top.appendChild(b);
            }
            const h = document.createElement('h3'); h.className = 'text-base font-black text-slate-900'; h.textContent = po.title;
            body.appendChild(top); body.appendChild(h);
            if (po.description) { const d = document.createElement('p'); d.className = 'text-sm text-slate-800 whitespace-pre-line'; d.textContent = po.description; body.appendChild(d); }
            art.appendChild(body);
            const imgs = (Array.isArray(po.images) ? po.images : []).filter(okUrl);
            if (imgs.length) {
                const g = document.createElement('div'); g.className = 'grid grid-cols-2 gap-0.5';
                imgs.forEach((u, i) => {
                    const im = document.createElement('img'); im.src = u; im.alt = po.title; im.loading = 'lazy';
                    im.className = 'w-full object-cover bg-slate-100 cursor-zoom-in ' + ((imgs.length === 1 || (imgs.length % 2 === 1 && i === 0)) ? 'col-span-2 h-60' : 'h-36');
                    im.onclick = () => vOpen(imgs, i); g.appendChild(im);
                });
                art.appendChild(g);
            }
            const foot = document.createElement('div'); foot.className = 'p-3 flex justify-end';
            const sh = document.createElement('button'); sh.className = 'text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-800 px-3.5 py-2 rounded-full cursor-pointer';
            sh.textContent = 'Compartilhar';
            sh.onclick = async () => {
                const url = location.origin + location.pathname + '?u=' + encodeURIComponent(key) + '#p-' + po.id;
                try { if (navigator.share) { await navigator.share({ title: po.title, text: po.title + ' — ' + ownerName, url }); return; } } catch (e) { return; }
                try { await navigator.clipboard.writeText(url); alert('Link copiado!'); } catch (e) { prompt('Copie o link:', url); }
            };
            foot.appendChild(sh); art.appendChild(foot);
            return art;
        }

        async function loadPosts(key, ownerName, before) {
            let list = [];
            try { list = await rpc('get_public_posts', { p_key: key, p_limit: 10, p_before: before || null }); } catch (e) { return; }
            if (!Array.isArray(list)) return;
            list.forEach(po => $('postList').appendChild(postCard(po, key, ownerName)));
            if (list.length) $('posts').classList.remove('hidden');
            const more = $('btnMore');
            more.classList.toggle('hidden', list.length < 10);
            more.onclick = () => loadPosts(key, ownerName, list[list.length - 1].created_at);
            if (!before && location.hash.startsWith('#p-')) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
        }

        function waLink(num, name) {
            let d = String(num || '').replace(/\D/g, '');
            if (!d) return null;
            if (d.length <= 11) d = '55' + d;
            return 'https://wa.me/' + d + '?text=' + encodeURIComponent('Olá' + (name ? ', ' + name.split(' ')[0] : '') + '! Vi seu perfil no ZapGarantia e gostaria de um orçamento.');
        }

        (async () => {
            const key = (new URLSearchParams(location.search).get('u') || '').trim();
            if (!key) { $('state').textContent = 'Perfil não encontrado.'; return; }
            let data = null;
            try { data = await getProfile(key); } catch (e) { $('state').textContent = 'Não consegui carregar agora. Confira a internet e tente de novo.'; return; }
            if (!data) { $('state').textContent = 'Perfil não encontrado ou indisponível.'; return; }
            document.title = data.name + ' | ZapGarantia';
            $('name').textContent = data.name;
            if (data.city) { $('city').textContent = data.city; $('city').classList.remove('hidden'); }
            if (data.bio) $('bio').textContent = data.bio;
            const n = Number(data.signed) || 0;
            if (n > 0) { $('signed').textContent = n + (n === 1 ? ' orçamento assinado' : ' orçamentos assinados'); $('signed').classList.remove('hidden'); }
            if (okUrl(data.cover_url)) { $('cover').src = data.cover_url; $('cover').classList.remove('hidden'); }
            if (okUrl(data.avatar_url)) $('avatar').src = data.avatar_url;
            const wa = waLink(data.whatsapp, data.name);
            if (wa) { $('btnWa').href = wa; $('btnWa').classList.remove('hidden'); $('btnWa2').href = wa; $('waBar').classList.remove('hidden'); }
            if (data.ref_code) $('cta').href = '/?ref=' + encodeURIComponent(data.ref_code);
            $('cta').classList.remove('hidden');
            $('btnShare').onclick = async () => {
                const url = location.href;
                try { if (navigator.share) { await navigator.share({ title: data.name + ' no ZapGarantia', text: 'Veja o perfil de ' + data.name, url }); return; } } catch (e) { return; }
                try { await navigator.clipboard.writeText(url); alert('Link copiado!'); } catch (e) { prompt('Copie o link:', url); }
            };
            $('state').classList.add('hidden');
            $('card').classList.remove('hidden');
            loadPosts(key, data.name, null);
        })();
    </script>
</body>
</html>
