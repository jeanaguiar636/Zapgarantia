    <script>
    (function () {
        var KEY = 'zg_last_error';
        function show(msg) {
            // a faixa vermelha só aparece se o endereço tiver ?debug (uso de suporte)
            if (!/[?&]debug\b/.test(location.search)) return;
            var b = document.getElementById('zgErr');
            if (!b) {
                b = document.createElement('div'); b.id = 'zgErr';
                b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b91c1c;color:#fff;font:13px sans-serif;padding:8px 12px;word-break:break-all';
                (document.body || document.documentElement).appendChild(b);
            }
            b.textContent = (b.textContent ? b.textContent + ' | ' : 'Erro no site: ') + msg;
            try { sessionStorage.setItem(KEY, b.textContent.slice(0, 700)); } catch (e) {}
        }
        window.addEventListener('error', function (e) {
            var t = e.target;
            if (t && t !== window) { if (t.tagName === 'IMG') return; show('Não carregou: ' + (t.src || t.href)); return; }
            show((e.message || 'erro') + (e.lineno ? ' (linha ' + e.lineno + ')' : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { show('Falha: ' + ((e.reason && e.reason.message) || e.reason)); });
        // formulário nunca recarrega a página (isso apagava o e-mail e a senha digitados)
        document.addEventListener('submit', function (e) { e.preventDefault(); }, true);
        // mostra o erro que aconteceu antes de a página recarregar
        document.addEventListener('DOMContentLoaded', function () {
            try { var p = sessionStorage.getItem(KEY); if (p) { sessionStorage.removeItem(KEY); show('(antes) ' + p); } } catch (e) {}
        });
    })();
