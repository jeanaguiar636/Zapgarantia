<!DOCTYPE html>
<html lang="pt-BR">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZapGarantia - Orçamento com Garantia</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>body{font-family:Inter,sans-serif} input,select,textarea{color:#0f172a !important} label{color:#1e293b !important; font-weight:700 !important; font-size:13px !important; display:block; margin-bottom:6px}</style>
</head>
<body class="bg-slate-50">
<header class="bg-gradient-to-r from-blue-600 to-blue-700 text-white shadow sticky top-0 z-40">
<div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center gap-2"><div class="w-9 h-9 bg-white rounded-xl flex items-center justify-center"><i class="fa-solid fa-file-shield text-blue-600"></i></div><div class="leading-none"><p class="font-black text-[17px]">ZapGarantia</p><p class="text-[10px] font-bold text-blue-100">ORÇAMENTO COM GARANTIA</p></div></div>
<div class="flex items-center gap-2">
<a href="/resolve/" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-black px-3.5 py-2 rounded-full shadow">Resolva</a>
<span id="planoBadge" class="hidden bg-white/20 text-white text-[11px] font-bold px-3 py-1.5 rounded-full">Plano Gratuito</span>
<button id="btnLogout" class="hidden bg-white text-blue-600 font-bold px-3.5 py-2 rounded-full text-xs">Sair</button>
</div>
</div>
</header>

<main class="max-w-4xl mx-auto p-4 space-y-4 pb-24">
<!-- AUTH -->
<div id="authBox" class="bg-white p-6 rounded-2xl border shadow-sm max-w-md mx-auto mt-8">
<h1 class="font-black text-xl">Entrar</h1>
<input id="email" type="email" placeholder="seu@email.com" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 mt-4 text-sm bg-slate-50">
<input id="password" type="password" placeholder="senha" class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 mt-3 text-sm bg-slate-50">
<p id="authMsg" class="text-xs text-red-600 mt-3 font-bold hidden"></p>
<div class="flex gap-3 mt-4"><button id="btnLogin" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl">Entrar</button><button id="btnSignup" class="flex-1 bg-slate-200 font-bold py-3 rounded-xl">Criar conta</button></div>
</div>

<!-- APP -->
<div id="app" class="hidden space-y-4">
<div class="bg-white p-4 rounded-2xl border flex justify-between items-center"><div><p id="userEmail" class="text-sm font-bold"></p><p id="contagem" class="text-[11px] text-slate-500"></p></div><button id="btnPro" class="bg-gradient-to-r from-amber-400 to-amber-500 text-white font-black px-4 py-2 rounded-full text-xs">Virar PRO R$12</button></div>

<div class="bg-white p-6 rounded-2xl border shadow-sm space-y-5">
<h2 class="font-black text-lg flex items-center gap-2"><i class="fa-solid fa-file-invoice text-blue-600"></i> Novo Orçamento</h2>

<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<div><label>Nome do cliente *</label><input id="f_cliente_nome" placeholder="Ex: Maria Silva" class="w-full border-2 border-slate-200 focus:border-blue-600 rounded-xl px-4 py-3 text-sm outline-none"></div>
<div><label>Contato / WhatsApp *</label><input id="f_cliente_contato" placeholder="Ex: (11) 99999-9999" class="w-full border-2 border-slate-200 focus:border-blue-600 rounded-xl px-4 py-3 text-sm outline-none"></div>
<div class="sm:col-span-2"><label>Serviço feito / Título do orçamento *</label><input id="f_servico" placeholder="Ex: Instalação de jardim, Troca de vazamento" class="w-full border-2 border-slate-200 focus:border-blue-600 rounded-xl px-4 py-3 text-sm outline-none font-bold"></div>
<div><label>Categoria</label><select id="f_categoria" class="w-full border-2 border-slate-200 bg-white rounded-xl px-4 py-3 text-sm outline-none">
<option value="jardineiro">Jardineiro</option>
<option value="encanador">Encanador</option>
<option value="eletricista">Eletricista</option>
<option value="pintor">Pintor</option>
<option value="pedreiro">Pedreiro</option>
<option value="ar_condicionado">Ar condicionado</option>
<option value="outro">Outro</option>
</select></div>
<div><label>Valor total R$ *</label><input id="f_valor" placeholder="Ex: 350,00" class="w-full border-2 border-slate-200 focus:border-blue-600 rounded-xl px-4 py-3 text-sm outline-none"></div>
</div>

<div><label>Descrição detalhada do serviço</label><textarea id="f_desc" rows="4" placeholder="Ex: Foi feito poda, limpeza, adubação..." class="w-full border-2 border-slate-200 focus:border-blue-600 rounded-xl px-4 py-3 text-sm outline-none resize-none"></textarea></div>

<!-- MATERIAIS COM NOME + CODIGO DO PRODUTO - DE VOLTA -->
<div class="bg-slate-50 border-2 border-slate-200 rounded-xl p-4 space-y-3">
<div class="flex justify-between items-center"><label class="mb-0">Materiais / Produtos usados</label><button id="btnAddMat" class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-full">+ Adicionar material</button></div>
<div id="listaMateriais" class="space-y-2"></div>
<p class="text-[11px] text-slate-500">Adicione nome, código do produto e valor. Isso aparece no PDF e no link do cliente.</p>
</div>

<!-- UPLOAD FOTOS -->
<div class="bg-blue-50 border-2 border-dashed border-blue-300 rounded-xl p-4">
<label class="flex items-center gap-2 text-blue-700"><i class="fa-solid fa-camera"></i> Fotos do serviço (antes/depois)</label>
<input id="f_fotos" type="file" accept="image/*" multiple class="w-full text-sm mt-2 file:mr-3 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white">
<p id="uploadMsg" class="text-xs text-slate-600 mt-2">Pode selecionar várias fotos.</p>
<div id="previewFotos" class="grid grid-cols-3 gap-2 mt-3"></div>
</div>

<button id="btnGerarOrc" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white font-black py-4 rounded-xl text-sm shadow-lg">Gerar link do orçamento</button>
</div>

<div id="resultadoOrc" class="hidden bg-white p-6 rounded-2xl border shadow-sm space-y-4">
<h3 class="font-black">Orçamento gerado ✅</h3>
<p id="linkOrc" class="text-xs text-blue-600 break-all bg-blue-50 p-3 rounded-xl"></p>
<div class="grid grid-cols-2 gap-2"><button id="btnCopiarOrc" class="bg-slate-900 text-white font-bold py-3 rounded-xl text-xs">Copiar link</button><button id="btnPdfOrc" class="bg-slate-200 font-bold py-3 rounded-xl text-xs">Baixar PDF</button></div>
</div>

<div class="bg-white p-5 rounded-2xl border shadow-sm">
<h3 class="font-black text-sm">Seus orçamentos</h3>
<div id="listaContracts" class="space-y-2 mt-4"></div>
</div>
</div>
</main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SB_URL = "https://gktfwlhvdnsezqcpjrpf.supabase.co";
const SB_KEY = "sb_publishable_haJ8eg8OciGN6cK8GGg3ig_bGOKUAud";
const supabase = createClient(SB_URL, SB_KEY);
let currentUser=null, materiais=[], fotosKeys=[];

function addMaterialRow(nome='', codigo='', valor=''){
  const id=Date.now()+Math.random();
  materiais.push({id, nome, codigo, valor});
  renderMateriais();
}
function renderMateriais(){
  const div=document.getElementById('listaMateriais'); div.innerHTML='';
  materiais.forEach((m,i)=>{
    const row=document.createElement('div'); row.className='bg-white border border-slate-200 rounded-xl p-3 grid grid-cols-1 sm:grid-cols-12 gap-2 items-end';
    row.innerHTML=`
      <div class="sm:col-span-5"><label class="text-[11px]">Nome do produto</label><input data-i="${i}" data-k="nome" value="${m.nome}" placeholder="Ex: Grama Esmeralda" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-xs"></div>
      <div class="sm:col-span-3"><label class="text-[11px]">Código do produto</label><input data-i="${i}" data-k="codigo" value="${m.codigo}" placeholder="Ex: GRM-001" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-xs"></div>
      <div class="sm:col-span-2"><label class="text-[11px]">Valor R$</label><input data-i="${i}" data-k="valor" value="${m.valor}" placeholder="50,00" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-xs"></div>
      <div class="sm:col-span-2"><button data-del="${i}" class="w-full bg-red-50 text-red-600 border border-red-200 font-bold py-2 rounded-lg text-xs">Remover</button></div>
    `;
    div.appendChild(row);
  });
  div.querySelectorAll('input[data-i]').forEach(inp=>{ inp.oninput=(e)=>{ const i=parseInt(e.target.dataset.i); const k=e.target.dataset.k; materiais[i][k]=e.target.value; } });
  div.querySelectorAll('button[data-del]').forEach(btn=>{ btn.onclick=(e)=>{ const i=parseInt(e.target.dataset.del); materiais.splice(i,1); renderMateriais(); } });
}
document.getElementById('btnAddMat').onclick=()=>addMaterialRow();
addMaterialRow();

async function checkAuth(){
  const { data:{user} } = await supabase.auth.getUser();
  if(!user){ document.getElementById('authBox').classList.remove('hidden'); document.getElementById('app').classList.add('hidden'); return; }
  currentUser=user;
  document.getElementById('authBox').classList.add('hidden'); document.getElementById('app').classList.remove('hidden');
  document.getElementById('userEmail').textContent=user.email;
  document.getElementById('planoBadge').classList.remove('hidden');
  document.getElementById('btnLogout').classList.remove('hidden');
  loadContracts();
}
document.getElementById('btnLogin').onclick=async()=>{
  const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
  const { error } = await supabase.auth.signInWithPassword({email,password});
  if(error){ document.getElementById('authMsg').textContent='Erro: '+error.message; document.getElementById('authMsg').classList.remove('hidden'); } else checkAuth();
};
document.getElementById('btnSignup').onclick=async()=>{
  const email=document.getElementById('email').value.trim(), password=document.getElementById('password').value;
  const { error } = await supabase.auth.signUp({email,password});
  document.getElementById('authMsg').textContent=error?error.message:'Conta criada! Clique Entrar'; document.getElementById('authMsg').classList.remove('hidden');
};
document.getElementById('btnLogout').onclick=async()=>{ await supabase.auth.signOut(); location.reload(); };

document.getElementById('f_fotos').onchange=async(e)=>{
  const files=e.target.files; if(!files.length) return;
  document.getElementById('uploadMsg').textContent='Enviando '+files.length+' fotos...';
  document.getElementById('previewFotos').innerHTML='';
  for(let file of files){
    const preview=document.createElement('img'); preview.src=URL.createObjectURL(file); preview.className='w-full h-20 object-cover rounded-lg border'; document.getElementById('previewFotos').appendChild(preview);
    try{
      const name=`${currentUser.id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g,'_')}`;
      const { data, error } = await supabase.storage.from('comprovantes').upload(name, file);
      if(!error) fotosKeys.push(data.path);
    }catch(err){ console.log(err); }
  }
  document.getElementById('uploadMsg').textContent='✅ '+fotosKeys.length+' fotos enviadas';
};

document.getElementById('btnGerarOrc').onclick=async()=>{
  const cliente_nome=document.getElementById('f_cliente_nome').value.trim();
  const cliente_contato=document.getElementById('f_cliente_contato').value.trim();
  const servico=document.getElementById('f_servico').value.trim();
  const categoria=document.getElementById('f_categoria').value;
  const valor=document.getElementById('f_valor').value.trim();
  const desc=document.getElementById('f_desc').value.trim();
  if(!cliente_nome || !servico){ alert('Preencha nome do cliente e serviço'); return; }
  document.getElementById('btnGerarOrc').textContent='Gerando...';
  const { data, error } = await supabase.from('contracts').insert({
    professional_id: currentUser.id,
    client_name: cliente_nome,
    client_contact: cliente_contato,
    service: servico,
    categoria: categoria,
    total: valor,
    content: desc,
    materiais: materiais,
    image_keys: fotosKeys,
    status: 'Pendente'
  }).select('public_token').single();
  document.getElementById('btnGerarOrc').textContent='Gerar link do orçamento';
  if(error){ alert('Erro: '+error.message); return; }
  const link=`https://zapgarantia.alibr.com.br/c/?token=${data.public_token}`;
  document.getElementById('linkOrc').innerHTML=`🔗 <a href="${link}" target="_blank" class="underline font-bold">${link}</a>`;
  document.getElementById('resultadoOrc').classList.remove('hidden');
  loadContracts();
};

async function loadContracts(){
  const { data } = await supabase.from('contracts').select('*').eq('professional_id', currentUser.id).order('created_at',{ascending:false}).limit(20);
  const lista=document.getElementById('listaContracts'); lista.innerHTML='';
  if(!data||!data.length){ lista.innerHTML='<p class="text-xs text-slate-500 text-center py-4">Nenhum orçamento ainda</p>'; return; }
  data.forEach(c=>{
    const d=document.createElement('div'); d.className='border-2 border-slate-100 rounded-xl p-3 text-xs flex justify-between items-center';
    d.innerHTML=`<div><p class="font-bold">${c.client_name} - ${c.service||''}</p><p class="text-[11px] text-slate-500">${c.status||'Pendente'} • R$ ${c.total||''} • ${new Date(c.created_at).toLocaleDateString('pt-BR')}</p></div><a href="/c/?token=${c.public_token}" class="bg-blue-50 text-blue-600 font-bold px-3 py-1.5 rounded-full">Abrir</a>`;
    lista.appendChild(d);
  });
}
checkAuth();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
